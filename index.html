<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiffPDF Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#EEF1F4; --sheet:#FFFFFF; --ink:#1B2430; --muted:#5A6573; --rule:#CDD4DC;
    --mark:#F5D547; --red:#B42318; --blue:#1F4E8C; --tint:#E3EAF3;
    --serif:'Noto Serif TC', serif; --sans:'Noto Sans TC', system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#141920; --sheet:#1D242D; --ink:#E4E9EF; --muted:#98A3B0; --rule:#334050;
      --mark:#C9A92E; --red:#F2877D; --blue:#8DB6F5; --tint:#22303F; color-scheme: dark;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 var(--sans); }
  .wrap { max-width:1200px; margin:0 auto; padding:0 16px; }
  :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  header.top { padding-top:40px; padding-bottom:24px; }
  h1 { font:700 2.25rem/1.2 var(--serif); margin:0; letter-spacing:.02em; }
  h1 mark { background:linear-gradient(transparent 55%, var(--mark) 55%); color:inherit; padding:0 .1em; }
  .lede { margin:8px 0 0; color:var(--muted); max-width:40em; }
  .sample { all:unset; cursor:pointer; color:var(--blue); text-decoration:underline; text-underline-offset:3px; }
  .sample:focus-visible { outline:2px solid var(--blue); }

  .slots { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .slot { background:var(--sheet); border:1.5px dashed var(--rule); border-radius:10px; transition:border-color .15s, background .15s; }
  .slot.filled { border-style:solid; border-color:var(--ink); }
  .slot.over { border-color:var(--blue); background:var(--tint); }
  .slot:has(input[type=file]:focus-visible) { outline:2px solid var(--blue); outline-offset:2px; }
  .drop { display:block; padding:20px 20px 12px; cursor:pointer; }
  .role { font:600 1.125rem/1.3 var(--serif); }
  .name { display:block; margin-top:6px; font-weight:500; overflow-wrap:anywhere; }
  .slot:not(.filled) .name { color:var(--muted); font-weight:400; }
  .range { padding:0 20px 16px; color:var(--muted); font-size:.9rem; }
  .rev { display:flex; align-items:center; gap:8px; margin:0 20px 16px; padding-top:12px; border-top:1px solid var(--rule); font-size:.9rem; cursor:pointer; }
  .rev input { accent-color:var(--blue); width:18px; height:18px; margin:0; }
  .slot:has(.rev input:checked) .role { color:var(--blue); }
  .range input, .margins input { width:4.5em; font:inherit; color:var(--ink); background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:2px 6px; margin:0 4px; }

  .adv { margin-top:16px; }
  .adv summary { cursor:pointer; color:var(--muted); font-size:.9rem; width:fit-content; }
  .adv summary:hover { color:var(--ink); }
  .margins { display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:10px; font-size:.9rem; color:var(--muted); }
  .hint { margin:6px 0 0; font-size:.85rem; color:var(--muted); }

  .controls { display:flex; flex-wrap:wrap; align-items:stretch; gap:16px; margin:20px 0 8px; }
  fieldset.modes { display:flex; flex:1 1 520px; margin:0; padding:0; border:0; gap:0; }
  .modes legend { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .modes label { flex:1; padding:10px 14px; background:var(--sheet); border:1px solid var(--rule); cursor:pointer; }
  .modes label + label { border-left:0; }
  .modes label:first-of-type { border-radius:8px 0 0 8px; }
  .modes label:last-of-type { border-radius:0 8px 8px 0; }
  .modes input { position:absolute; opacity:0; }
  .modes b { display:block; font-weight:500; }
  .modes small { color:var(--muted); font-size:.8rem; }
  .modes label:has(input:checked) { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .modes label:has(input:checked) small { color:inherit; opacity:.75; }
  .modes label:has(input:focus-visible) { outline:2px solid var(--blue); outline-offset:2px; }
  button { font:inherit; cursor:pointer; border-radius:8px; }
  #go { padding:0 32px; min-height:52px; background:var(--red); color:#fff; border:0; font-weight:700; font-size:1.05rem; }
  #go:disabled { opacity:.5; cursor:progress; }
  .progress { display:flex; align-items:center; gap:12px; min-height:28px; color:var(--muted); font-size:.9rem; }
  progress { width:180px; accent-color:var(--red); }
  progress[hidden] { display:none; }

  .summary { position:sticky; top:0; z-index:1; background:var(--paper); border-bottom:1px solid var(--rule); padding:12px 0; margin-top:16px; }
  .summary .wrap { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
  .summary strong { font:600 1.1rem var(--serif); }
  .jump { display:flex; flex-wrap:wrap; gap:6px; flex:1; }
  .jump a { white-space:nowrap; color:var(--ink); text-decoration:none; font-size:.85rem; padding:2px 10px; border:1px solid var(--rule); border-radius:999px; background:var(--sheet); font-variant-numeric:tabular-nums; }
  .jump a:hover { border-color:var(--ink); }
  #save, #csv { padding:8px 18px; background:var(--sheet); color:var(--ink); border:1.5px solid var(--ink); font-weight:500; }

  .pair { padding:28px 0; border-bottom:1px solid var(--rule); scroll-margin-top:64px; }
  .pair header { display:flex; align-items:baseline; gap:12px; margin-bottom:12px; }
  .pair h2 { font:600 1.35rem var(--serif); margin:0; }
  .count { color:var(--red); font-size:.9rem; font-weight:500; }
  .sides { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  figure { margin:0; }
  figcaption { font-size:.85rem; color:var(--muted); margin-bottom:6px; overflow-wrap:anywhere; }
  canvas { display:block; width:100%; height:auto; background:#fff; border:1px solid var(--rule); box-shadow:0 1px 2px rgba(27,36,48,.08); }
  .notes { margin:16px 0 0; padding-left:2.2em; max-width:72em; font-variant-numeric:tabular-nums; }
  .notes li { padding:3px 0; }
  .notes li::marker { color:var(--muted); }
  .note { all:unset; cursor:zoom-in; border-radius:4px; padding:0 4px; margin:0 -4px; }
  .note:hover { background:var(--tint); }
  .note:focus-visible { outline:2px solid var(--blue); }
  .sides canvas { cursor:zoom-in; }
  del { color:var(--red); text-decoration-thickness:1.5px; }
  ins { color:var(--blue); text-decoration:underline 2px; text-underline-offset:3px; }
  del + ins { margin-left:.6em; }
  .empty { padding:48px 0; text-align:center; color:var(--muted); }
  .empty strong { display:block; font:600 1.5rem var(--serif); color:var(--ink); margin-bottom:4px; }
  #viewer { width:100vw; height:100dvh; max-width:none; max-height:none; margin:0; padding:0; border:0; background:var(--paper); color:var(--ink); }
  #viewer[open] { display:flex; flex-direction:column; }
  #viewer::backdrop { background:rgba(20,25,32,.6); }
  .vbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px; padding:10px 16px; border-bottom:1px solid var(--rule); }
  .vbar strong { font:600 1.1rem var(--serif); }
  .vtools { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .vtools button { min-width:36px; padding:4px 12px; background:var(--sheet); color:var(--ink); border:1px solid var(--rule); }
  .vtools button[aria-pressed=true] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .vtools button:disabled { opacity:.4; cursor:not-allowed; }
  #zlabel { min-width:3.5em; text-align:center; font-variant-numeric:tabular-nums; }
  .vlegend { margin:0; padding:6px 16px; font-size:.85rem; border-bottom:1px solid var(--rule); }
  .vlegend .r { color:#D92D20; font-weight:700; } .vlegend .c { color:#0E9CAD; font-weight:700; }
  .vpanes { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:2px; background:var(--rule); }
  .vpanes.one { grid-template-columns:1fr; }
  .pane { overflow:auto; background:#C9D0D8; }
  .pane .cap { position:sticky; top:0; left:0; z-index:1; padding:4px 10px; font-size:.8rem; background:var(--paper); color:var(--muted); border-bottom:1px solid var(--rule); }
  .pane canvas { max-width:none; border:0; box-shadow:none; margin:12px; }
  .meta { padding:0 20px 16px; color:var(--muted); font-size:.9rem; }
  .modes label:has(input:disabled) { opacity:.45; cursor:not-allowed; }
  .filter-btn { margin-left:auto; padding:4px 12px; font-size:.85rem; background:var(--sheet); color:var(--ink); border:1px solid var(--rule); }
  .filter-btn:hover { border-color:var(--ink); }
  .notice { margin:16px 0 0; padding:10px 14px; border-radius:8px; background:var(--tint); border:1px solid var(--rule); font-size:.9rem; color:var(--ink); }

  .doc-diff { background:var(--sheet); border:1px solid var(--rule); border-radius:8px; overflow:hidden; }
  .doc-row { display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--rule); }
  .doc-row:last-child { border-bottom:0; }
  .doc-row.is-del { background:rgba(180,35,24,.06); }
  .doc-row.is-ins { background:rgba(31,78,140,.07); }
  .doc-row.is-mod { background:rgba(245,213,71,.12); }
  .doc-cell { padding:10px 14px; overflow-wrap:anywhere; min-width:0; }
  .doc-cell + .doc-cell { border-left:1px solid var(--rule); }
  .doc-cell .bnum { display:inline-block; min-width:2.2em; font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums; margin-right:6px; user-select:none; }
  .doc-cell h1, .doc-cell h2, .doc-cell h3, .doc-cell h4, .doc-cell h5, .doc-cell h6 { font-family:var(--serif); margin:0; font-size:1.05rem; display:inline; }
  .doc-cell p { margin:0; display:inline; }
  .doc-cell del { background:rgba(180,35,24,.12); padding:0 2px; border-radius:3px; }
  .doc-cell ins { background:rgba(31,78,140,.14); padding:0 2px; border-radius:3px; }
  .doc-skip { padding:6px 14px; text-align:center; font-size:.82rem; color:var(--muted); background:var(--paper); border-bottom:1px solid var(--rule); }
  .doc-table-wrap { overflow-x:auto; }
  .doc-mini { border-collapse:collapse; width:100%; font-size:.88rem; }
  .doc-mini th, .doc-mini td { border:1px solid var(--rule); padding:4px 8px; text-align:left; vertical-align:top; }

  .sheet-wrap { overflow:auto; max-height:70vh; border:1px solid var(--rule); border-radius:8px; background:var(--sheet); }
  .sheet-diff { border-collapse:collapse; width:100%; font-size:.9rem; font-variant-numeric:tabular-nums; }
  .sheet-diff th, .sheet-diff td { border:1px solid var(--rule); padding:6px 10px; text-align:left; vertical-align:top; white-space:pre-wrap; min-width:72px; }
  .sheet-diff thead th { position:sticky; top:0; z-index:1; background:var(--paper); color:var(--muted); font-weight:600; text-align:center; }
  .sheet-diff .rnum { width:3.5em; min-width:3.5em; text-align:right; color:var(--muted); background:var(--paper); font-size:.82rem; }
  .sheet-diff tr.row-del { background:rgba(180,35,24,.09); }
  .sheet-diff tr.row-ins { background:rgba(31,78,140,.10); }
  .sheet-diff tr.row-skip td { text-align:center; color:var(--muted); background:var(--paper); font-size:.82rem; padding:6px; }
  .sheet-diff td.cell-mod { background:rgba(245,213,71,.35); box-shadow:inset 0 0 0 1.5px var(--red); }
  .sheet-diff td del { background:rgba(180,35,24,.12); padding:0 2px; border-radius:2px; }
  .sheet-diff td ins { background:rgba(31,78,140,.14); padding:0 2px; border-radius:2px; }
  @media (prefers-color-scheme: dark) {
    .doc-row.is-del, .sheet-diff tr.row-del { background:rgba(242,135,125,.12); }
    .doc-row.is-ins, .sheet-diff tr.row-ins { background:rgba(141,182,245,.12); }
    .doc-row.is-mod { background:rgba(201,169,46,.14); }
    .sheet-diff td.cell-mod { background:rgba(201,169,46,.24); }
    .doc-cell del, .sheet-diff td del { background:rgba(242,135,125,.2); }
    .doc-cell ins, .sheet-diff td ins { background:rgba(141,182,245,.2); }
  }
  footer { padding:32px 0 48px; color:var(--muted); font-size:.85rem; }

  @media (max-width:720px) {
    .slots, .sides, .doc-row { grid-template-columns:1fr; }
    .doc-cell + .doc-cell { border-left:0; border-top:1px dashed var(--rule); }
    fieldset.modes { flex-direction:column; flex-basis:100%; }
    .modes label + label { border-left:1px solid var(--rule); border-top:0; }
    .modes label:first-of-type { border-radius:8px 8px 0 0; }
    .modes label:last-of-type { border-radius:0 0 8px 8px; }
    #go { width:100%; }
    .summary .wrap { justify-content:space-between; gap:8px; }
    .summary { position:static; }
    .summary strong { font-size:.95rem; flex:1 1 100%; }
    #save, #csv { padding:4px 12px; font-size:.9rem; }
    .jump { order:3; flex:1 1 100%; flex-wrap:nowrap; overflow-x:auto; padding-bottom:2px; }
    h1 { font-size:1.8rem; }
    .vpanes { grid-template-columns:1fr; grid-template-rows:1fr 1fr; }
    .vpanes.one { grid-template-rows:1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } html { scroll-behavior:auto; } }
  html { scroll-behavior:smooth; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.3/jspdf.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>

<body>
<header class="top wrap">
  <h1>DiffPDF <mark>Web</mark></h1>
  <p class="lede">比對兩份 PDF、Word（<code>.docx</code>）或 Excel（<code>.xlsx</code> / <code>.xls</code> / <code>.csv</code>）的文字與內容差異。檔案只在你的瀏覽器裡處理，不會上傳。可以一次把兩個檔案拖進頁面。沒有檔案？載入範例：<button class="sample" data-files="original.pdf revised.pdf">營運計畫 (PDF)</button>、<button class="sample" data-files="finance-original.pdf finance-revised.pdf">財務報表 (PDF)</button>、<button class="sample" data-files="contract-original.docx contract-revised.docx">合約條款 (Word)</button>、<button class="sample" data-files="budget-original.xlsx budget-revised.xlsx">部門預算 (Excel)</button></p>
</header>

<main class="wrap">
  <div class="slots">
    <div class="slot" id="slot1">
      <label class="drop" for="f1"><span class="role">原版</span><span class="name">點這裡選擇檔案，或把 PDF / Word / Excel 拖進來</span></label>
      <input type="file" id="f1" class="sr-only" accept=".pdf,.docx,.xlsx,.xls,.ods,.csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv">
      <div class="range">從第<input type="number" id="p1" value="1" min="1" aria-label="第 1 份檔案的起始頁">頁開始比對<span class="pages"></span></div>
      <div class="meta" hidden></div>
      <label class="rev"><input type="radio" name="rev" value="1">這份是修正後的檔案</label>
    </div>
    <div class="slot" id="slot2">
      <label class="drop" for="f2"><span class="role">修正版</span><span class="name">點這裡選擇檔案，或把 PDF / Word / Excel 拖進來</span></label>
      <input type="file" id="f2" class="sr-only" accept=".pdf,.docx,.xlsx,.xls,.ods,.csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv">
      <div class="range">從第<input type="number" id="p2" value="1" min="1" aria-label="第 2 份檔案的起始頁">頁開始比對<span class="pages"></span></div>
      <div class="meta" hidden></div>
      <label class="rev"><input type="radio" name="rev" value="2" checked>這份是修正後的檔案</label>
    </div>
  </div>

  <details class="adv">
    <summary>忽略頁面邊緣（頁首、頁尾、頁碼）</summary>
    <div class="margins">
      <label>上<input type="number" id="mt" value="0" min="0">mm</label>
      <label>下<input type="number" id="mb" value="0" min="0">mm</label>
      <label>左<input type="number" id="ml" value="0" min="0">mm</label>
      <label>右<input type="number" id="mr" value="0" min="0">mm</label>
    </div>
    <p class="hint">這些範圍內的文字和圖案不列入比對，結果頁面上會以灰色標示。</p>
  </details>

  <div class="controls">
    <fieldset class="modes">
      <legend>比對方式</legend>
      <label><input type="radio" name="mode" value="chars" checked><b>逐字</b><small>適合中文，數字整串比</small></label>
      <label><input type="radio" name="mode" value="words"><b>逐詞</b><small>適合英文</small></label>
      <label><input type="radio" name="mode" value="appearance"><b>版面</b><small>逐像素，抓字型與圖表</small></label>
    </fieldset>
    <button id="go">開始比對</button>
  </div>
  <div class="progress"><progress id="bar" hidden></progress><span id="status">比對時請保持這個分頁在前景。</span></div>
</main>

<div class="summary" id="summary" hidden>
  <div class="wrap"><strong id="total"></strong><nav class="jump" id="jump" aria-label="跳到有差異的頁面"></nav><button id="csv" title="每處差異一列，可用 Excel 開啟">匯出 Excel</button><button id="save">匯出 PDF</button></div>
</div>
<div class="wrap" id="out"></div>
<dialog id="viewer" aria-labelledby="vtitle">
  <div class="vbar">
    <strong id="vtitle"></strong>
    <div class="vtools">
      <button id="vside" aria-pressed="true">並排</button><button id="vover" aria-pressed="false">重疊</button>
      <button id="zout" aria-label="縮小">−</button><span id="zlabel">100%</span><button id="zin" aria-label="放大">＋</button>
      <button id="vclose">關閉</button>
    </div>
  </div>
  <p class="vlegend" id="vlegend" hidden><span class="r">紅色</span>只在原版，<span class="c">藍綠色</span>只在修正版，黑色是兩版相同。</p>
  <div class="vpanes" id="vpanes"></div>
</dialog>

<footer class="wrap">以 <a href="https://github.com/cormort/diffpdf-web" style="color:inherit">DiffPDF</a> 的三種比對模式為藍本，使用 pdf.js、Mammoth.js 與 SheetJS 在瀏覽器內運算。</footer>

<script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

const SCALE = 1.5;
const $ = id => document.getElementById(id);
const CJK = '\\p{Script=Han}\\p{Script=Hiragana}\\p{Script=Katakana}';
const HYPHENS = /[­‐-―−]/g;

async function load(input) {
  return pdfjs.getDocument({ data: await input.files[0].arrayBuffer() }).promise;
}

async function render(doc, n) {
  const canvas = document.createElement('canvas');
  if (!doc || n > doc.numPages) { canvas.width = canvas.height = 1; return { canvas, tokens: [] }; }
  const page = await doc.getPage(n);
  const vp = page.getViewport({ scale: SCALE });
  canvas.width = vp.width; canvas.height = vp.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  return { canvas, page, vp };
}

// Split each text item into word or character tokens with approximate boxes.
// Margins to ignore, in canvas px, as [top, bottom, left, right].
const MM = 72 / 25.4 * SCALE;
const margins = () => ['mt', 'mb', 'ml', 'mr'].map(id => Math.max(0, +$(id).value || 0) * MM);

function shade(canvas, [t, b, l, r]) {
  if (!(t || b || l || r) || canvas.width < 2) return;
  const ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(90,101,115,0.25)';
  ctx.fillRect(0, 0, W, t); ctx.fillRect(0, H - b, W, b); ctx.fillRect(0, t, l, H - t - b); ctx.fillRect(W - r, t, r, H - t - b);
}

async function tokens(page, vp, mode, [mt, mb, ml, mr]) {
  if (!page) return [];
  const out = [];
  // Characters mode: each CJK char is a token, but numbers/Latin runs stay whole so "455,420" isn't split into digits.
  const re = mode === 'words' ? /\S+/g : new RegExp(`[${CJK}]|[^\\s${CJK}]+`, 'gu');
  const items = (await page.getTextContent()).items.filter(it => it.str).map(it => {
    const tx = pdfjs.Util.transform(vp.transform, it.transform);
    return { str: it.str, x: tx[4], y: tx[5], h: Math.hypot(tx[2], tx[3]), w: it.width * SCALE };
  });
  // Reading order by position, not content-stream order, so identical-looking pages extract identically.
  // ponytail: same-line = baselines within half a line height; fine for tables, not for rotated text.
  items.sort((a, b) => Math.abs(a.y - b.y) > Math.min(a.h, b.h) / 2 ? a.y - b.y : a.x - b.x);
  for (const it of items) {
    // NFKC folds look-alike code points (Kangxi radical ⼤ → 大, full-width forms).
    const str = it.str.normalize('NFKC').replace(HYPHENS, '-'), len = str.length;
    for (const m of str.matchAll(re)) {
      const t = { t: m[0], x: it.x + it.w * m.index / len, y: it.y - it.h, w: it.w * m[0].length / len, h: it.h };
      const cx = t.x + t.w / 2, cy = t.y + t.h / 2;
      if (cx >= ml && cx <= vp.width - mr && cy >= mt && cy <= vp.height - mb) out.push(t);
    }
  }
  return out;
}

// Marks tokens not in the LCS. ponytail: O(n*m) DP after trimming common ends; switch to Myers if huge pages get slow.
function diff(a, b) {
  let s = 0, ea = a.length, eb = b.length;
  while (s < ea && s < eb && a[s].t === b[s].t) s++;
  while (ea > s && eb > s && a[ea - 1].t === b[eb - 1].t) { ea--; eb--; }
  const n = ea - s, m = eb - s, W = m + 1, L = new Uint32Array((n + 1) * W);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i * W + j] = a[s + i].t === b[s + j].t ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
  // Consecutive changed tokens form one hunk {d: deleted, i: inserted} for the notes.
  const da = [], db = [], hunks = [];
  let h = null, i = 0, j = 0;
  const flush = () => { if (h) hunks.push(h); h = null; };
  const del = t => { (h ??= { d: [], i: [] }).d.push(t); da.push(t); };
  const ins = t => { (h ??= { d: [], i: [] }).i.push(t); db.push(t); };
  while (i < n && j < m) {
    if (a[s + i].t === b[s + j].t) { flush(); i++; j++; }
    else if (L[(i + 1) * W + j] >= L[i * W + j + 1]) del(a[s + i++]);
    else ins(b[s + j++]);
  }
  while (i < n) del(a[s + i++]);
  while (j < m) ins(b[s + j++]);
  flush();
  return [da, db, hunks];
}

function mark(canvas, boxes) {
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(245,213,71,0.5)';
  ctx.strokeStyle = 'rgba(180,35,24,0.9)';
  ctx.lineWidth = 2;
  // Padded so a one-character change like "-" is still easy to spot.
  for (const b of boxes) { ctx.fillRect(b.x - 3, b.y - 2, b.w + 6, b.h + 4); ctx.strokeRect(b.x - 3, b.y - 2, b.w + 6, b.h + 4); }
}

// Strict pixel comparison; tints every differing pixel red on both sides.
function pixelDiff(c1, c2, [t, b, l, r]) {
  const W = Math.max(c1.width, c2.width), H = Math.max(c1.height, c2.height);
  const grab = c => c.getContext('2d').getImageData(0, 0, W, H);
  const d1 = grab(c1), d2 = grab(c2), p1 = d1.data, p2 = d2.data;
  let count = 0;
  for (let y = Math.ceil(t); y < H - b; y++) for (let x = Math.ceil(l); x < W - r; x++) {
    const k = (y * W + x) * 4;
    if (p1[k] !== p2[k] || p1[k + 1] !== p2[k + 1] || p1[k + 2] !== p2[k + 2] || p1[k + 3] !== p2[k + 3]) {
      count++;
      p1[k] = p2[k] = 255; p1[k + 1] = p2[k + 1] = 0; p1[k + 2] = p2[k + 2] = 0; p1[k + 3] = p2[k + 3] = 255;
    }
  }
  if (count) for (const [c, d] of [[c1, d1], [c2, d2]]) { c.width = W; c.height = H; c.getContext('2d').putImageData(d, 0, 0); }
  return count;
}

let results = [], names = [], currentFormat = 'pdf', exportEntries = [];
const slotMeta = [null, null, null];
const noteText = n => n.msg ?? (n.d && n.i ? `「${n.d}」→「${n.i}」` : n.d ? `刪除「${n.d}」` : `新增「${n.i}」`);

const normText = s => String(s ?? '').normalize('NFKC').replace(HYPHENS, '-');
function tokenizeStr(str, mode) {
  const s = normText(str);
  const re = mode === 'words' ? /\S+/g : new RegExp(`[${CJK}]|[^\\s${CJK}]+`, 'gu');
  return [...s.matchAll(re)].map(m => ({ t: m[0] }));
}
const tokensToText = ts => ts.map(t => t.t).join(' ').replace(new RegExp(`(?<=[${CJK}]) (?=[${CJK}])`, 'gu'), '');

function fileKind(file) {
  if (!file) return null;
  const n = file.name.toLowerCase(), t = file.type;
  if (t === 'application/pdf' || n.endsWith('.pdf')) return 'pdf';
  if (n.endsWith('.docx') || t === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') return 'docx';
  if (n.endsWith('.doc') || t === 'application/msword') return 'doc-legacy';
  if (/\.(xlsx|xls|ods|csv)$/i.test(n) || t === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' || t === 'application/vnd.ms-excel' || t === 'text/csv') return 'excel';
  return null;
}

async function parseDocx(file) {
  if (!window.mammoth) throw new Error('Mammoth.js 尚未載入完成，請檢查網路連線後重試。');
  const buf = await file.arrayBuffer();
  const { value: html } = await window.mammoth.convertToHtml({ arrayBuffer: buf });
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const blocks = [];
  function walk(node) {
    for (const ch of node.children) {
      const tag = ch.tagName.toLowerCase();
      if (tag === 'table') {
        const rows = [...ch.querySelectorAll('tr')].map(tr =>
          [...tr.children].map(td => td.textContent.replace(/\s+/g, ' ').trim())
        ).filter(r => r.some(Boolean));
        if (rows.length) blocks.push({ type: 'table', rows });
      } else if (/^(h[1-6]|p|li|pre|blockquote)$/.test(tag)) {
        const text = ch.textContent.replace(/\s+/g, ' ').trim();
        if (text) blocks.push({ type: 'text', tag, text });
      } else {
        walk(ch);
      }
    }
  }
  walk(doc.body);
  return blocks;
}

async function parseExcel(file) {
  if (!window.XLSX) throw new Error('SheetJS 尚未載入完成，請檢查網路連線後重試。');
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, { type: 'array', cellFormula: true, cellNF: true });
  const sheets = wb.SheetNames.map(name => {
    const ws = wb.Sheets[name];
    const ref = ws['!ref'];
    if (!ref) return { name, rows: [] };
    const range = window.XLSX.utils.decode_range(ref);
    const rows = [];
    for (let r = range.s.r; r <= range.e.r; r++) {
      const row = [];
      for (let c = range.s.c; c <= range.e.c; c++) {
        const cell = ws[window.XLSX.utils.encode_cell({ r, c })];
        const text = cell ? (cell.w ?? (cell.v != null ? String(cell.v) : '')) : '';
        const formula = cell?.f ? '=' + cell.f : '';
        row.push({ text: String(text), formula });
      }
      while (row.length && !row.at(-1).text && !row.at(-1).formula) row.pop();
      rows.push(row);
    }
    while (rows.length && !rows.at(-1).length) rows.pop();
    return { name, rows };
  });
  return { sheets };
}

function syncControls() {
  const k1 = slotMeta[1]?.kind, k2 = slotMeta[2]?.kind;

  else if (k1 === 'excel' && k2 === 'excel') $('status').textContent = '兩份 Excel 活頁簿已就緒，請按「開始比對」。';

async function show(k) {
  const input = $('f' + k), slot = $('slot' + k), f = input.files[0];
  if (!f) return;
  slot.classList.add('filled');
  slot.querySelector('.name').textContent = f.name;
  const rangeDiv = slot.querySelector('.range'), metaDiv = slot.querySelector('.meta'), pages = slot.querySelector('.pages');
  const kind = fileKind(f);
  slotMeta[k] = { kind, file: f };
  if (kind === 'pdf') {
    rangeDiv.hidden = false; metaDiv.hidden = true;
    let text;
    try { const d = await load(input); text = `，共 ${d.numPages} 頁`; $('p' + k).max = d.numPages; }
    catch { text = '，這個檔案無法以 PDF 開啟'; }
    if (input.files[0] !== f) return;
    pages.textContent = text;
    syncControls();
    if (slotMeta[1]?.kind === 'pdf' && slotMeta[2]?.kind === 'pdf') autoAlign();
  } else if (kind === 'docx') {
    rangeDiv.hidden = true; metaDiv.hidden = false;
    metaDiv.textContent = '讀取 Word 文件中…';
    try {
      const blocks = await parseDocx(f);
      if (input.files[0] !== f) return;
      const pCount = blocks.filter(b => b.type === 'text').length;
      const tCount = blocks.filter(b => b.type === 'table').length;
      slotMeta[k].parsed = blocks;
      metaDiv.textContent = `Word 文件，共 ${pCount} 個段落` + (tCount ? `、${tCount} 個表格` : '');
    } catch (e) {
      if (input.files[0] !== f) return;
      metaDiv.textContent = '無法讀取這個 Word 檔案：' + e.message;
    }
    syncControls();
  } else if (kind === 'excel') {
    rangeDiv.hidden = true; metaDiv.hidden = false;
    metaDiv.textContent = '讀取 Excel 活頁簿中…';
    try {
      const wb = await parseExcel(f);
      if (input.files[0] !== f) return;
      slotMeta[k].parsed = wb;
      const list = wb.sheets.map(s => s.name).join('、');
      metaDiv.textContent = `Excel 活頁簿，共 ${wb.sheets.length} 個工作表（${list}）`;
    } catch (e) {
      if (input.files[0] !== f) return;
      metaDiv.textContent = '無法讀取這個 Excel 檔案：' + e.message;
    }
    syncControls();
  } else {
    rangeDiv.hidden = true; metaDiv.hidden = false;
    metaDiv.textContent = kind === 'doc-legacy' ? '不支援舊版 .doc 格式，請先另存為 .docx' : '不支援的檔案格式';
    syncControls();
  }
}

// Auto-align: find the page offset where the most page pairs share nearly the same words.
async function pageSets(input) {
  const d = await load(input), out = [];
  for (let n = 1; n <= d.numPages; n++) {
    const t = (await (await d.getPage(n)).getTextContent()).items.map(i => i.str).join(' ').normalize('NFKC');
    out.push(new Set(t.split(/\s+/).filter(Boolean)));
  }
  return out;
}
const jaccard = (a, b) => { let k = 0; for (const x of a) if (b.has(x)) k++; return k ? k / (a.size + b.size - k) : 0; };
const role = k => k === revised() ? '修正版' : '原版';

async function autoAlign() {
  const f1 = $('f1').files[0], f2 = $('f2').files[0];
  if (!f1 || !f2 || slotMeta[1]?.kind !== 'pdf' || slotMeta[2]?.kind !== 'pdf') return;
  $('status').textContent = '正在自動對齊頁碼…';
  try {
    const [A, B] = await Promise.all([pageSets($('f1')), pageSets($('f2'))]);
    if ($('f1').files[0] !== f1 || $('f2').files[0] !== f2) return;
    let best = { hits: 0, sum: 0, d: 0 };
    for (let d = -(B.length - 1); d < A.length; d++) {
      let hits = 0, sum = 0;
      for (let i = Math.max(0, d); i < A.length && i - d < B.length; i++) { const j = jaccard(A[i], B[i - d]); sum += j; if (j > 0.8) hits++; }
      if (hits > best.hits || (hits === best.hits && sum > best.sum)) best = { hits, sum, d };
    }
    if (!best.hits) { $('status').textContent = '找不到內容相近的頁面，請自行設定起始頁。'; return; }
    $('p1').value = best.d >= 0 ? best.d + 1 : 1;
    $('p2').value = best.d < 0 ? 1 - best.d : 1;
    $('status').textContent = best.d
      ? `已自動對齊：${role(1)}第 ${$('p1').value} 頁對應${role(2)}第 ${$('p2').value} 頁，可自行修改。`
      : '兩份檔案的頁碼已對齊。';
  } catch { $('status').textContent = ''; }
}

function setFile(k, file) {

}

// Drop anywhere: two files fill both slots in order; one file goes to the slot it was dropped on, else the first empty one.
function dropFiles(files, target) {
  const list = [...files];
  if (list.some(f => fileKind(f) === 'doc-legacy') && !list.some(f => ['pdf', 'docx', 'excel'].includes(fileKind(f)))) {
    $('status').textContent = '不支援舊版 .doc 格式，請先用 Word 另存為 .docx。'; return;
  }
  const valid = list.filter(f => ['pdf', 'docx', 'excel'].includes(fileKind(f)));
  if (!valid.length) { $('status').textContent = '請放入 PDF、Word（.docx）或 Excel（.xlsx / .xls / .csv）檔案。'; return; }
  if (valid.length > 1) { setFile(1, valid[0]); setFile(2, valid[1]); return; }
  setFile(target ?? ($('f1').files[0] && !$('f2').files[0] ? 2 : 1), valid[0]);
}

const mimeOf = n => n.endsWith('.docx') ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'

function wrap(ctx, text, width) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > width) { lines.push(line); line = '  '; }
    line += ch;
  }
  return [...lines, line];
}

// One export page: header, both pages side by side, numbered notes below.
// ponytail: drawn on a canvas so Chinese needs no embedded font; text in the exported PDF isn't selectable.
function composite({ label, c1, c2, notes }) {
  const M = 24, F = 20, LH = 28;
  const w = Math.max(c1.width, c2.width), h = Math.max(c1.height, c2.height), W = w * 2 + M * 3;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  ctx.font = `${F}px sans-serif`;
  const lines = notes.flatMap((t, k) => wrap(ctx, `${k + 1}. ${noteText(t)}`, W - M * 2));
  c.width = W; c.height = M + LH * 2 + h + M + lines.length * LH + M;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#000'; ctx.textBaseline = 'top';
  ctx.font = `bold ${F}px sans-serif`;
  ctx.fillText(`${label}　${names[0]}  ↔  ${names[1]}`, M, M);
  ctx.drawImage(c1, M, M + LH * 2); ctx.drawImage(c2, M * 2 + w, M + LH * 2);
  ctx.font = `${F}px sans-serif`;
  lines.forEach((l, k) => ctx.fillText(l, M, M + LH * 2 + h + M + k * LH));
  return c;
}

const download = (blob, name) => {

// Viewer: both pages at a chosen zoom with synced scrolling, or one overlay of clean renders.

function pane(src, caption, focus) {
  const c = el('canvas');

  if (focus) { ctx.strokeStyle = '#1F4E8C'; ctx.lineWidth = 4; ctx.strokeRect(focus.x - 8, focus.y - 6, focus.w + 16, focus.h + 12); }

async function cleanRender(page) {
  const vp = page.getViewport({ scale: SCALE }), c = el('canvas');
  c.width = vp.width; c.height = vp.height;

// Red channel from the revised page, green+blue from the original: original-only ink shows red, revised-only shows cyan.
async function overlayCanvas(r) {
  const [a, b] = await Promise.all([cleanRender(r.p1), cleanRender(r.p2)]);
  const W = Math.max(a.width, b.width), H = Math.max(a.height, b.height);
  const da = a.getContext('2d').getImageData(0, 0, W, H).data, db = b.getContext('2d').getImageData(0, 0, W, H).data;
  const out = new ImageData(W, H), o = out.data;
  const lum = (d, k) => d[k + 3] ? d[k] * 0.299 + d[k + 1] * 0.587 + d[k + 2] * 0.114 : 255;
  for (let k = 0; k < o.length; k += 4) { const l1 = lum(da, k), l2 = lum(db, k); o[k] = l2; o[k + 1] = o[k + 2] = l1; o[k + 3] = 255; }
  const c = el('canvas');
  c.width = W; c.height = H;
  c.getContext('2d').putImageData(out, 0, 0);
  return c;
}

  applyZoom(zoom, focus && { x: focus.x + focus.w / 2, y: focus.y + focus.h / 2 });
}

// Keeps the given canvas point (default: current centre) in the middle of each pane.
function applyZoom(prev, at) {
  $('zlabel').textContent = Math.round(zoom * 100) + '%';
  $('zin').disabled = zoom === ZOOMS.at(-1); $('zout').disabled = zoom === ZOOMS[0];
  syncing = true;
  for (const p of $('vpanes').querySelectorAll('.pane')) {
    const c = p.querySelector('canvas'), M = 12;
    const cx = at ? at.x : (p.scrollLeft + p.clientWidth / 2 - M) / prev, cy = at ? at.y : (p.scrollTop + p.clientHeight / 2 - M) / prev;
    c.style.width = c.width * zoom + 'px';
    p.scrollLeft = cx * zoom + M - p.clientWidth / 2;
    p.scrollTop = cy * zoom + M - p.clientHeight / 2;
  }
  requestAnimationFrame(() => syncing = false);
}

$('vpanes').addEventListener('scroll', e => {
  if (syncing) return;
  syncing = true;
  for (const p of $('vpanes').querySelectorAll('.pane')) if (p !== e.target) { p.scrollTop = e.target.scrollTop; p.scrollLeft = e.target.scrollLeft; }
  requestAnimationFrame(() => syncing = false);
}, true);
$('zin').onclick = () => { const prev = zoom; zoom = ZOOMS[ZOOMS.indexOf(zoom) + 1] ?? zoom; applyZoom(prev); };
$('zout').onclick = () => { const prev = zoom; zoom = ZOOMS[ZOOMS.indexOf(zoom) - 1] ?? zoom; applyZoom(prev); };
$('vside').onclick = () => { overlay = false; drawViewer(); };
$('vover').onclick = () => { overlay = true; drawViewer(); };
$('vclose').onclick = () => $('viewer').close();

function renderTextReportPages(title, rows) {
  const W = 1200, H = 1600, M = 48, F = 20, LH = 30;
  const pages = [];
  let c = document.createElement('canvas'), ctx = c.getContext('2d'), y = M;
  const newPage = () => {
    c = document.createElement('canvas'); c.width = W; c.height = H;
    ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'top'; y = M; pages.push(c);
  };
  newPage();
  ctx.fillStyle = '#1B2430'; ctx.font = `bold 24px sans-serif`;
  ctx.fillText(title, M, y); y += 38;
  ctx.font = `18px sans-serif`; ctx.fillStyle = '#5A6573';
  ctx.fillText(`${names[0]}  ↔  ${names[1]}`, M, y); y += 36;
  ctx.strokeStyle = '#CDD4DC'; ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(W - M, y); ctx.stroke(); y += 20;

  for (let idx = 0; idx < rows.length; idx++) {
    const r = rows[idx];
    ctx.font = `bold ${F}px sans-serif`;
    const head = `${idx + 1}. [${r.sheet ? r.sheet + ' · ' : ''}${r.loc}] ${r.type}`;
    const dLines = r.d ? wrap(ctx, `原版：${r.d}`, W - M * 2 - 20) : [];
    const iLines = r.i ? wrap(ctx, `修正：${r.i}`, W - M * 2 - 20) : [];
    const need = LH + (dLines.length + iLines.length) * LH + 14;
    if (y + need > H - M) newPage();
    ctx.fillStyle = '#1B2430'; ctx.font = `bold ${F}px sans-serif`;
    ctx.fillText(head, M, y); y += LH;
    ctx.font = `${F}px sans-serif`;
    ctx.fillStyle = '#B42318';
    for (const l of dLines) { ctx.fillText(l, M + 20, y); y += LH; }
    ctx.fillStyle = '#1F4E8C';
    for (const l of iLines) { ctx.fillText(l, M + 20, y); y += LH; }
    y += 14;
  }
  return pages;
}

$('save').onclick = () => {
  let pdf;
  const canvases = currentFormat === 'pdf'
    ? results.map(r => composite(r))
    : renderTextReportPages($('total').textContent || '差異報告', exportEntries);
  for (const c of canvases) {

    if (!pdf) pdf = new window.jspdf.jsPDF({ orientation: o, unit: 'px', format: size, hotfixes: ['px_scaling'] });
    else pdf.addPage(size, o);
    pdf.addImage(c.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, c.width, c.height);
  }
  pdf.save(currentFormat === 'pdf' ? 'diffpdf-result.pdf' : 'diff-result.pdf');
};

function lcsHunks(a, b, keyFn = x => x) {
  let s = 0, ea = a.length, eb = b.length;
  while (s < ea && s < eb && keyFn(a[s]) === keyFn(b[s])) s++;
  while (ea > s && eb > s && keyFn(a[ea - 1]) === keyFn(b[eb - 1])) { ea--; eb--; }
  const n = ea - s, m = eb - s, out = [];
  if (s > 0) for (let k = 0; k < s; k++) out.push({ type: 'eq', a: a[k], b: b[k], ia: k, ib: k });
  if (n * m > 4_000_000) {
    const minLen = Math.min(n, m);
    for (let k = 0; k < minLen; k++) {
      if (keyFn(a[s + k]) === keyFn(b[s + k])) out.push({ type: 'eq', a: a[s + k], b: b[s + k], ia: s + k, ib: s + k });
      else out.push({ type: 'diff', d: [{ item: a[s + k], idx: s + k }], i: [{ item: b[s + k], idx: s + k }] });
    }
    if (n > minLen) out.push({ type: 'diff', d: a.slice(s + minLen, ea).map((item, idx) => ({ item, idx: s + minLen + idx })), i: [] });
    if (m > minLen) out.push({ type: 'diff', d: [], i: b.slice(s + minLen, eb).map((item, idx) => ({ item, idx: s + minLen + idx })) });
  } else {
    const W = m + 1, L = new Uint32Array((n + 1) * W);
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      L[i * W + j] = keyFn(a[s + i]) === keyFn(b[s + j]) ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
    let cur = null, i = 0, j = 0;
    const flush = () => { if (cur) out.push(cur); cur = null; };
    while (i < n && j < m) {
      if (keyFn(a[s + i]) === keyFn(b[s + j])) {
        flush(); out.push({ type: 'eq', a: a[s + i], b: b[s + j], ia: s + i, ib: s + j }); i++; j++;
      } else if (L[(i + 1) * W + j] >= L[i * W + j + 1]) {
        (cur ??= { type: 'diff', d: [], i: [] }).d.push({ item: a[s + i], idx: s + i }); i++;
      } else {
        (cur ??= { type: 'diff', d: [], i: [] }).i.push({ item: b[s + j], idx: s + j }); j++;
      }
    }
    while (i < n) (cur ??= { type: 'diff', d: [], i: [] }).d.push({ item: a[s + i], idx: s + i++ });
    while (j < m) (cur ??= { type: 'diff', d: [], i: [] }).i.push({ item: b[s + j], idx: s + j++ });
    flush();
  }
  for (let k = 0; k < a.length - ea; k++) out.push({ type: 'eq', a: a[ea + k], b: b[eb + k], ia: ea + k, ib: eb + k });
  return out;
}

const colName = idx => { let s = '', n = idx + 1; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };

function buildInlineDiff(str1, str2, mode) {
  const t1 = tokenizeStr(str1, mode), t2 = tokenizeStr(str2, mode);
  const hunks = lcsHunks(t1, t2, x => x.t);
  const leftNodes = [], rightNodes = [], notes = [];
  for (const h of hunks) {
    if (h.type === 'eq') {
      const txt = h.a.t + (mode === 'words' ? ' ' : '');
      leftNodes.push(txt); rightNodes.push(txt);
    } else {
      const dTxt = tokensToText(h.d.map(x => x.item)), iTxt = tokensToText(h.i.map(x => x.item));
      if (dTxt) leftNodes.push(el('del', { textContent: dTxt + (mode === 'words' ? ' ' : '') }));
      if (iTxt) rightNodes.push(el('ins', { textContent: iTxt + (mode === 'words' ? ' ' : '') }));
      notes.push({ d: dTxt, i: iTxt });
    }
  }
  return { leftNodes, rightNodes, notes };
}

function diffRows(rows1, rows2, mode) {
  const rowKey = r => r.map(c => normText(c.text ?? c)).join('\x00');
  const hunks = lcsHunks(rows1, rows2, rowKey);
  const outRows = [], notes = [];
  let maxCols = Math.max(1, ...rows1.map(r => r.length), ...rows2.map(r => r.length));
  const cellText = c => typeof c === 'string' ? c : (c?.text ?? '');
  const cellFormula = c => typeof c === 'string' ? '' : (c?.formula ?? '');

  for (const h of hunks) {
    if (h.type === 'eq') {
      outRows.push({ kind: 'eq', r1: h.ia + 1, r2: h.ib + 1, cells: h.a.map(c => ({ kind: 'eq', text: cellText(c) })) });
    } else {
      const paired = Math.min(h.d.length, h.i.length);
      for (let k = 0; k < paired; k++) {
        const ra = h.d[k], rb = h.i[k], cells = [];
        const cols = Math.max(ra.item.length, rb.item.length);
        maxCols = Math.max(maxCols, cols);
        let rowChanged = false;
        for (let c = 0; c < cols; c++) {
          const v1 = cellText(ra.item[c]), v2 = cellText(rb.item[c]);
          const f1 = cellFormula(ra.item[c]), f2 = cellFormula(rb.item[c]);
          if (normText(v1) === normText(v2) && f1 === f2) {
            cells.push({ kind: 'eq', text: v2 });
          } else {
            rowChanged = true;
            const dStr = f1 && v1 !== f1 ? `${v1} (${f1})` : v1;
            const iStr = f2 && v2 !== f2 ? `${v2} (${f2})` : v2;
            cells.push({ kind: 'mod', d: dStr, i: iStr });
            notes.push({ loc: `${colName(c)}${rb.idx + 1}`, type: '修改', d: dStr, i: iStr });
          }
        }
        outRows.push({ kind: rowChanged ? 'mod' : 'eq', r1: ra.idx + 1, r2: rb.idx + 1, cells });
      }
      for (let k = paired; k < h.d.length; k++) {
        const ra = h.d[k], txt = ra.item.map(cellText).filter(Boolean).join(' | ');
        outRows.push({ kind: 'del', r1: ra.idx + 1, r2: '', cells: ra.item.map(c => ({ kind: 'del', text: cellText(c) })) });
        notes.push({ loc: `原第 ${ra.idx + 1} 列`, type: '刪除', d: txt, i: '' });
      }
      for (let k = paired; k < h.i.length; k++) {
        const rb = h.i[k], txt = rb.item.map(cellText).filter(Boolean).join(' | ');
        outRows.push({ kind: 'ins', r1: '', r2: rb.idx + 1, cells: rb.item.map(c => ({ kind: 'ins', text: cellText(c) })) });
        notes.push({ loc: `修第 ${rb.idx + 1} 列`, type: '新增', d: '', i: txt });
      }
    }
  }
  return { rows: outRows, maxCols, notes };
}

function renderDocTable(rows, side) {
  const tbl = el('table', { className: 'doc-mini' });
  for (const r of rows) {
    const tr = el('tr');
    for (const c of r) tr.append(el('td', { textContent: typeof c === 'string' ? c : (c?.text ?? '') }));
    tbl.append(tr);
  }
  return el('div', { className: 'doc-table-wrap' }, tbl);
}

function renderDiffTable(diffRes) {
  const tbl = el('table', { className: 'doc-mini' });
  for (const r of diffRes.rows) {
    const tr = el('tr', { className: r.kind === 'del' ? 'row-del' : r.kind === 'ins' ? 'row-ins' : '' });
    for (let c = 0; c < diffRes.maxCols; c++) {
      const cell = r.cells[c];
      if (!cell) tr.append(el('td'));
      else if (cell.kind === 'mod') tr.append(el('td', { className: 'cell-mod' }, el('del', { textContent: cell.d }), ' ', el('ins', { textContent: cell.i })));
      else if (cell.kind === 'del') tr.append(el('td', {}, el('del', { textContent: cell.text })));
      else if (cell.kind === 'ins') tr.append(el('td', {}, el('ins', { textContent: cell.text })));
      else tr.append(el('td', { textContent: cell.text }));
    }
    tbl.append(tr);
  }
  return el('div', { className: 'doc-table-wrap' }, tbl);
}

async function extractPdfBlocks(file) {
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const blocks = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const page = await doc.getPage(n);
    const items = (await page.getTextContent()).items.filter(it => it.str.trim()).map(it => ({
      str: it.str, x: it.transform[4], y: it.transform[5], h: Math.hypot(it.transform[2], it.transform[3]) || 12
    }));
    items.sort((a, b) => Math.abs(b.y - a.y) > Math.min(a.h, b.h) / 2 ? b.y - a.y : a.x - b.x);
    let line = '', prevY = null, prevH = 12;
    for (const it of items) {
      if (prevY !== null && Math.abs(prevY - it.y) > Math.min(prevH, it.h) / 2) {
        if (line.trim()) blocks.push({ type: 'text', tag: 'p', text: line.trim(), page: n });
        line = '';
      }
      line += (line && !line.endsWith(' ') ? ' ' : '') + it.str;
      prevY = it.y; prevH = it.h;
    }
    if (line.trim()) blocks.push({ type: 'text', tag: 'p', text: line.trim(), page: n });
  }
  return blocks;
}

function compareBlocks(blocks1, blocks2, mode) {
  const keyFn = b => b.type === 'table'
    ? 'TBL:' + b.rows.map(r => r.map(normText).join('|')).join('\n')
    : 'TXT:' + normText(b.text);
  const hunks = lcsHunks(blocks1, blocks2, keyFn);
  const items = [], notes = [];
  let changes = 0;

  for (const h of hunks) {
    if (h.type === 'eq') {
      items.push({ kind: 'eq', a: h.a, b: h.b, ia: h.ia + 1, ib: h.ib + 1 });
      continue;
    }
    let i1 = 0, i2 = 0;
    while (i1 < h.d.length && i2 < h.i.length) {
      const b1 = h.d[i1], b2 = h.i[i2];
      if (b1.item.type === 'text' && b2.item.type === 'text') {
        const loc = `段落 ${b1.idx + 1} ↔ ${b2.idx + 1}`;
        const inl = buildInlineDiff(b1.item.text, b2.item.text, mode);
        items.push({ kind: 'mod-text', a: b1.item, b: b2.item, ia: b1.idx + 1, ib: b2.idx + 1, inl });
        for (const n of inl.notes) notes.push({ loc, type: n.d && n.i ? '修改' : n.d ? '刪除' : '新增', d: n.d, i: n.i });
        changes++; i1++; i2++;
      } else if (b1.item.type === 'table' && b2.item.type === 'table') {
        const tblDiff = diffRows(b1.item.rows, b2.item.rows, mode);
        items.push({ kind: 'mod-table', a: b1.item, b: b2.item, ia: b1.idx + 1, ib: b2.idx + 1, tblDiff });
        for (const n of tblDiff.notes) notes.push({ loc: `表格 #${b1.idx + 1} (${n.loc})`, type: n.type, d: n.d, i: n.i });
        changes++; i1++; i2++;
      } else {
        break;
      }
    }
    while (i1 < h.d.length) {
      const b1 = h.d[i1++];
      const txt = b1.item.type === 'table' ? '[表格] ' + b1.item.rows.map(r => r.join(' | ')).join(' / ') : b1.item.text;
      items.push({ kind: 'del', a: b1.item, ia: b1.idx + 1 });
      notes.push({ loc: `原段落 ${b1.idx + 1}`, type: '刪除', d: txt, i: '' });
      changes++;
    }
    while (i2 < h.i.length) {
      const b2 = h.i[i2++];
      const txt = b2.item.type === 'table' ? '[表格] ' + b2.item.rows.map(r => r.join(' | ')).join(' / ') : b2.item.text;
      items.push({ kind: 'ins', b: b2.item, ib: b2.idx + 1 });
      notes.push({ loc: `修段落 ${b2.idx + 1}`, type: '新增', d: '', i: txt });
      changes++;
    }
  }
  return { items, notes, changes };
}

function renderDocDiff(res, isCrossFormat) {
  const out = $('out');
  if (isCrossFormat) {
    out.append(el('div', { className: 'notice', textContent: '跨格式文字比對（PDF ↔ Word）：依閱讀順序擷取純文字段落進行逐字 / 逐詞比對，版面樣式不列入比較。' }));
  }
  if (!res.changes) {
    out.append(el('div', { className: 'empty' }, el('strong', { textContent: '兩份文件文字相同' }), `比對了 ${res.items.length} 個區塊，沒有找到差異。`));
    $('status').textContent = '比對完成。';
    return;
  }

  let onlyDiff = true;
  const wrap = el('div', { className: 'doc-diff' });
  const toggleBtn = el('button', { className: 'filter-btn', textContent: '顯示全文' });

  function draw() {
    wrap.innerHTML = '';
    const keep = new Set();
    if (onlyDiff) {
      res.items.forEach((it, idx) => {
        if (it.kind !== 'eq') { keep.add(idx - 1); keep.add(idx); keep.add(idx + 1); }
      });
    }
    let skipped = 0;
    const flushSkip = () => { if (skipped) { wrap.append(el('div', { className: 'doc-skip', textContent: `… 略過 ${skipped} 段相同內容 …` })); skipped = 0; } };

    res.items.forEach((it, idx) => {
      if (onlyDiff && !keep.has(idx)) { skipped++; return; }
      flushSkip();
      const row = el('div', { className: 'doc-row' + (it.kind === 'del' ? ' is-del' : it.kind === 'ins' ? ' is-ins' : it.kind !== 'eq' ? ' is-mod' : '') });
      const cell = (num, content) => {
        const c = el('div', { className: 'doc-cell' });
        if (num) c.append(el('span', { className: 'bnum', textContent: `#${num}` }));
        if (content) c.append(content);
        return c;
      };
      if (it.kind === 'eq') {
        const make = (b, n) => cell(n, b.type === 'table' ? renderDocTable(b.rows) : el(b.tag || 'p', { textContent: b.text }));
        row.append(make(it.a, it.ia), make(it.b, it.ib));
      } else if (it.kind === 'mod-text') {
        row.append(
          cell(it.ia, el(it.a.tag || 'p', {}, ...it.inl.leftNodes)),
          cell(it.ib, el(it.b.tag || 'p', {}, ...it.inl.rightNodes))
        );
      } else if (it.kind === 'mod-table') {
        row.append(
          cell(it.ia, renderDocTable(it.a.rows)),
          cell(it.ib, renderDiffTable(it.tblDiff))
        );
      } else if (it.kind === 'del') {
        row.append(cell(it.ia, it.a.type === 'table' ? renderDocTable(it.a.rows) : el(it.a.tag || 'p', {}, el('del', { textContent: it.a.text }))), cell('', null));
      } else if (it.kind === 'ins') {
        row.append(cell('', null), cell(it.ib, it.b.type === 'table' ? renderDocTable(it.b.rows) : el(it.b.tag || 'p', {}, el('ins', { textContent: it.b.text }))));
      }
      wrap.append(row);
    });
    flushSkip();
  }

  toggleBtn.onclick = () => { onlyDiff = !onlyDiff; toggleBtn.textContent = onlyDiff ? '顯示全文' : '只看差異'; draw(); };
  draw();

  const shownNotes = res.notes.slice(0, MAX_NOTES);
  const ol = el('ol', { className: 'notes' }, ...shownNotes.map(n => {
    const body = [el('strong', { textContent: `[${n.loc}] ` }), ...(n.d ? [el('del', { textContent: n.d })] : []), ...(n.i ? [el('ins', { textContent: n.i })] : [])];
    return el('li', {}, el('span', {}, ...body));
  }));
  if (res.notes.length > MAX_NOTES) ol.append(el('li', {}, el('span', { textContent: `另有 ${res.notes.length - MAX_NOTES} 處差異未列出` })));

  out.append(el('section', { className: 'pair', id: 'doc1' },
    el('header', {}, el('h2', { textContent: '文件內容比對' }), el('span', { className: 'count', textContent: `${res.notes.length} 處差異` }), toggleBtn),
    wrap, ol));

  exportEntries = res.notes;
  $('total').textContent = `共發現 ${res.notes.length} 處差異`;
  $('jump').append(el('a', { href: '#doc1', textContent: '文件內容' }));
  $('summary').hidden = false;
  $('status').textContent = '比對完成。';
}

function matchSheets(wb1, wb2) {
  const s1 = wb1.sheets, s2 = wb2.sheets;
  if (s1.length === 1 && s2.length === 1 && s1[0].name !== s2[0].name) {
    return [{ name: `${s1[0].name} ↔ ${s2[0].name}`, a: s1[0], b: s2[0], renamed: true }];
  }
  const map2 = new Map(s2.map(s => [s.name, s])), used = new Set(), pairs = [];
  for (const a of s1) {
    const b = map2.get(a.name) ?? null;
    if (b) used.add(b.name);
    pairs.push({ name: a.name, a, b });
  }
  for (const b of s2) if (!used.has(b.name)) pairs.push({ name: b.name, a: null, b });
  return pairs;
}

function renderExcelDiff(wb1, wb2, mode) {
  const pairs = matchSheets(wb1, wb2), out = $('out');
  let differ = 0;
  exportEntries = [];

  pairs.forEach((p, idx) => {
    const id = 'sheet' + (idx + 1);
    let diffRes, sheetMsg = '';
    if (!p.a || !p.b) {
      const only = p.a ? '原版' : '修正版', rows = (p.a || p.b).rows;
      sheetMsg = `僅存在於${only}（共 ${rows.length} 列）`;
      diffRes = {
        rows: rows.map((r, rIdx) => ({ kind: p.a ? 'del' : 'ins', r1: p.a ? rIdx + 1 : '', r2: p.b ? rIdx + 1 : '', cells: r.map(c => ({ kind: p.a ? 'del' : 'ins', text: c.text })) })),
        maxCols: Math.max(1, ...rows.map(r => r.length)),
        notes: [{ loc: '整張工作表', type: p.a ? '刪除' : '新增', d: p.a ? sheetMsg : '', i: p.b ? sheetMsg : '' }]
      };
    } else {
      diffRes = diffRows(p.a.rows, p.b.rows, mode);
    }
    if (!diffRes.notes.length) return;
    differ++;
    for (const n of diffRes.notes) exportEntries.push({ sheet: p.name, ...n });

    let onlyDiff = true;
    const toggleBtn = el('button', { className: 'filter-btn', textContent: '顯示全部列' });
    const tableWrap = el('div', { className: 'sheet-wrap' });

    function drawTable() {
      const tbl = el('table', { className: 'sheet-diff' });
      const thead = el('thead'), htr = el('tr');
      htr.append(el('th', { className: 'rnum', textContent: '原列' }), el('th', { className: 'rnum', textContent: '修列' }));
      for (let c = 0; c < diffRes.maxCols; c++) htr.append(el('th', { textContent: colName(c) }));
      thead.append(htr); tbl.append(thead);

      const tbody = el('tbody');
      const keep = new Set([0]);
      if (onlyDiff) {
        diffRes.rows.forEach((r, rIdx) => {
          if (r.kind !== 'eq') { keep.add(rIdx - 1); keep.add(rIdx); keep.add(rIdx + 1); }
        });
      }
      let skipped = 0;
      const flushSkip = () => {
        if (skipped) {
          tbody.append(el('tr', { className: 'row-skip' }, el('td', { colSpan: diffRes.maxCols + 2, textContent: `… 略過 ${skipped} 列相同資料 …` })));
          skipped = 0;
        }
      };

      diffRes.rows.forEach((r, rIdx) => {
        if (onlyDiff && !keep.has(rIdx)) { skipped++; return; }
        flushSkip();
        const tr = el('tr', { className: r.kind === 'del' ? 'row-del' : r.kind === 'ins' ? 'row-ins' : '' });
        tr.append(el('td', { className: 'rnum', textContent: r.r1 }), el('td', { className: 'rnum', textContent: r.r2 }));
        for (let c = 0; c < diffRes.maxCols; c++) {
          const cell = r.cells[c];
          if (!cell) tr.append(el('td'));
          else if (cell.kind === 'mod') tr.append(el('td', { className: 'cell-mod' }, el('del', { textContent: cell.d }), ' ', el('ins', { textContent: cell.i })));
          else if (cell.kind === 'del') tr.append(el('td', {}, el('del', { textContent: cell.text })));
          else if (cell.kind === 'ins') tr.append(el('td', {}, el('ins', { textContent: cell.text })));
          else tr.append(el('td', { textContent: cell.text }));
        }
        tbody.append(tr);
      });
      flushSkip();
      tbl.append(tbody);
      tableWrap.replaceChildren(tbl);
    }

    toggleBtn.onclick = () => { onlyDiff = !onlyDiff; toggleBtn.textContent = onlyDiff ? '顯示全部列' : '只看差異列'; drawTable(); };
    drawTable();

    const shownNotes = diffRes.notes.slice(0, MAX_NOTES);
    const ol = el('ol', { className: 'notes' }, ...shownNotes.map(n => {
      const body = [el('strong', { textContent: `[${n.loc}] ` }), ...(n.d ? [el('del', { textContent: n.d })] : []), ...(n.i ? [el('ins', { textContent: n.i })] : [])];
      return el('li', {}, el('span', {}, ...body));
    }));
    if (diffRes.notes.length > MAX_NOTES) ol.append(el('li', {}, el('span', { textContent: `另有 ${diffRes.notes.length - MAX_NOTES} 處差異未列出` })));

    out.append(el('section', { className: 'pair', id },
      el('header', {}, el('h2', { textContent: p.name }), el('span', { className: 'count', textContent: sheetMsg || `${diffRes.notes.length} 處差異` }), toggleBtn),
      tableWrap, ol));
    $('jump').append(el('a', { href: '#' + id, textContent: p.name }));
  });

  if (differ) {
    $('total').textContent = `${pairs.length} 個工作表中共有 ${differ} 個不同`;
    $('summary').hidden = false;
    $('status').textContent = '比對完成。';
  } else {
    out.append(el('div', { className: 'empty' }, el('strong', { textContent: '兩份活頁簿相同' }), `比對了 ${pairs.length} 個工作表，沒有找到差異。`));
    $('status').textContent = '比對完成。';
  }
}

$('go').onclick = async () => {
  if (!$('f1').files[0] || !$('f2').files[0]) { $('status').textContent = '請先放入原版和修正版兩個檔案。'; return; }
  const mode = document.querySelector('input[name=mode]:checked').value, out = $('out'), bar = $('bar');
  out.innerHTML = ''; $('jump').innerHTML = ''; $('summary').hidden = true;
  const R = revised(), O = 3 - R; // original goes on the left, revised on the right
  results = []; exportEntries = [];
  const fO = $('f' + O).files[0], fR = $('f' + R).files[0];
  const kO = slotMeta[O]?.kind, kR = slotMeta[R]?.kind;
  names = [fO.name, fR.name];

  if (!kO || !kR || kO === 'doc-legacy' || kR === 'doc-legacy') {
    $('status').textContent = '請放入支援的檔案格式（PDF、.docx、.xlsx / .xls / .csv）。'; return;
  }
  if ((kO === 'excel') !== (kR === 'excel')) {
    $('status').textContent = 'Excel 只能與 Excel 比對；PDF 與 Word 可互相或各自比對。'; return;
  }

  $('go').disabled = true; bar.hidden = false;
  try {
    if (kO === 'excel' && kR === 'excel') {
      currentFormat = 'excel';
      $('status').textContent = '比對工作表中…';
      const wb1 = slotMeta[O].parsed ?? await parseExcel(fO);
      const wb2 = slotMeta[R].parsed ?? await parseExcel(fR);
      renderExcelDiff(wb1, wb2, mode);
    } else if ((kO === 'docx' || kR === 'docx')) {
      currentFormat = (kO === 'docx' && kR === 'docx') ? 'docx' : 'cross';
      $('status').textContent = '解析與比對文件中…';
      const b1 = kO === 'docx' ? (slotMeta[O].parsed ?? await parseDocx(fO)) : await extractPdfBlocks(fO);
      const b2 = kR === 'docx' ? (slotMeta[R].parsed ?? await parseDocx(fR)) : await extractPdfBlocks(fR);
      renderDocDiff(compareBlocks(b1, b2, mode), currentFormat === 'cross');
    } else {
      currentFormat = 'pdf';
      const [d1, d2] = await Promise.all([load($('f' + O)), load($('f' + R))]);
      // Start pages let a file with extra leading pages line up (a lite version of DiffPDF's page ranges).
      const s1 = Math.max(1, +$('p' + O).value || 1), s2 = Math.max(1, +$('p' + R).value || 1);
      const total = Math.max(d1.numPages - s1, d2.numPages - s2) + 1, m = margins();
      let differ = 0;
      for (let k = 0; k < total; k++) {
        const a = s1 + k, b = s2 + k, label = a === b ? `第 ${a} 頁` : `第 ${a} ↔ ${b} 頁`;
        $('status').textContent = `比對中 ${k + 1} / ${total}`;
        bar.max = total; bar.value = k;
        const [r1, r2] = await Promise.all([render(d1, a), render(d2, b)]);
        let notes;
        if (!r1.page || !r2.page) notes = [{ msg: `${r1.page ? '修正版' : '原版'}沒有這一頁` }];
        else if (mode === 'appearance') {
          const px = pixelDiff(r1.canvas, r2.canvas, m);
          notes = px ? [{ msg: `${px.toLocaleString()} 個像素不同（${(px / (r1.canvas.width * r1.canvas.height) * 100).toFixed(2)}%）` }] : [];
        } else {
          const [da, db, hunks] = diff(await tokens(r1.page, r1.vp, mode, m), await tokens(r2.page, r2.vp, mode, m));
          mark(r1.canvas, da); mark(r2.canvas, db);
          const box = ts => {
            if (!ts.length) return null;
            const x = Math.min(...ts.map(t => t.x)), y = Math.min(...ts.map(t => t.y));
            return { x, y, w: Math.max(...ts.map(t => t.x + t.w)) - x, h: Math.max(...ts.map(t => t.y + t.h)) - y };
          };
          notes = hunks.map(h => ({ d: tokensToText(h.d), i: tokensToText(h.i), bd: box(h.d), bi: box(h.i) }));
          if (notes.length > MAX_NOTES) notes = [...notes.slice(0, MAX_NOTES), { msg: `另有 ${notes.length - MAX_NOTES} 處差異未列出` }];
        }
        if (!notes.length) continue;
        differ++;
        shade(r1.canvas, m); shade(r2.canvas, m);
        const entry = { label, a, b, c1: r1.canvas, c2: r2.canvas, p1: r1.page, p2: r2.page, notes };
        results.push(entry);
        for (const c of [r1.canvas, r2.canvas]) Object.assign(c, {
          tabIndex: 0, title: '放大檢視', onclick: () => openViewer(entry),
          onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openViewer(entry); } },
        });
        const id = 'pg' + (k + 1), short = a === b ? `${a}` : `${a}↔${b}`;
        const count = notes.some(n => n.msg) ? '' : `${notes.length} 處修改`;
        out.append(el('section', { className: 'pair', id },
          el('header', {}, el('h2', { textContent: label }), el('span', { className: 'count', textContent: count })),
          el('div', { className: 'sides' },
            el('figure', {}, el('figcaption', { textContent: `原版　${names[0]}　p.${a}` }), r1.canvas),
            el('figure', {}, el('figcaption', { textContent: `修正版　${names[1]}　p.${b}` }), r2.canvas)),
          el('ol', { className: 'notes' }, ...notes.map(n => {
            const body = n.msg ? [n.msg] : [...(n.d ? [el('del', { textContent: n.d })] : []), ...(n.i ? [el('ins', { textContent: n.i })] : [])];
            return el('li', {}, n.bd || n.bi
              ? el('button', { className: 'note', title: '放大檢視這處修改', onclick: () => openViewer(entry, n) }, ...body)
              : el('span', {}, ...body));
          }))));
        $('jump').append(el('a', { href: '#' + id, textContent: short }));
      }
      if (differ) {
        $('total').textContent = `${total} 組頁面中有 ${differ} 組不同`;
        $('summary').hidden = false;
        $('status').textContent = '比對完成。';
      } else {
        out.append(el('div', { className: 'empty' }, el('strong', { textContent: '兩份檔案相同' }), `比對了 ${total} 組頁面，沒有找到差異。`));
        $('status').textContent = '比對完成。';
      }
    }
  } catch (e) {
    $('status').textContent = '無法比對：' + e.message;
  } finally {
    $('go').disabled = false; bar.hidden = true;
  }
};
</script>
</body>
</html>
